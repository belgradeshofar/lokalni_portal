name: Automatsko prikupljanje vesti

on:
  schedule:
    - cron: '0 * * * *' # Svakog sata
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Podesi Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instaliraj biblioteke
        run: pip install -r requirements.txt

      - name: Pokreni skriptu
        run: python src/main.py

      - name: Sačuvaj rezultate na GitHub
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add content/vesti.json
          git commit -m "Automatsko ažuriranje vesti [skip ci]" || exit 0
          git push